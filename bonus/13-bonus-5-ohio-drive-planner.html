<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>App</title>
<style>
:root { --acc: #1f3a5f; --sec: #e9b949; --ok: #1e7d4f; --ko: #b3261e; --bg: #f5f6f8; --card: #ffffff;
  --ink: #1b1f24; --muted: #5f6873; --line: #dde1e6; --r: 14px; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-text-size-adjust: 100%; }
header.app { background: var(--acc); color: #fff; padding: 18px 16px 16px; }
header.app .in, main .in, footer.app .in { max-width: 860px; margin: 0 auto; }
header.app .et { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--sec); }
header.app h1 { margin: 4px 0 2px; font-size: 24px; line-height: 1.15; }
header.app .sub { opacity: .9; font-size: 14px; }
main { padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin: 0 0 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04); }
h2 { font-size: 19px; margin: 0 0 10px; color: var(--acc); }
h3 { font-size: 16px; margin: 14px 0 6px; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; }
button, .btn { font: inherit; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; background: var(--acc);
  color: #fff; font-weight: 600; min-height: 44px; }
button.sec, .btn.sec { background: #e8ecf1; color: var(--ink); }
button.ghost { background: transparent; color: var(--acc); border: 1px solid var(--line); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sec); outline-offset: 2px; }
input[type=text], input[type=number], input[type=date], select, textarea { font: inherit; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff; min-height: 44px; width: 100%; }
label.lab { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 14px; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #eef2f7; color: var(--acc);
  font-size: 12px; font-weight: 600; }
.bar { height: 10px; background: #e8ecf1; border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.ok { color: var(--ok); } .ko { color: var(--ko); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; background: #eef2f7; padding: 8px; }
table.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
footer.app { padding: 18px 16px 30px; color: var(--muted); font-size: 12px; }
footer.app p { margin: 4px 0; }
.nascosto { display: none !important; }
.modale { position: fixed; inset: 0; background: rgba(10,15,25,.55); display: flex; align-items: center;
  justify-content: center; padding: 16px; z-index: 50; }
.modale .card { max-width: 440px; width: 100%; }
#porta { min-height: 60vh; display: flex; align-items: center; justify-content: center; }
#porta .card { max-width: 420px; width: 100%; }
@media (max-width: 520px) { header.app h1 { font-size: 21px; } main { padding: 12px; } .card { padding: 14px; } }
@media print { header.app, footer.app, button { display: none !important; } body { background: #fff; } .card { border: 0; box-shadow: none; } }

.aggiungi { flex-wrap: nowrap; }
.aggiungi input { flex: 1 1 auto; min-width: 0; font-size: 18px; }
.aggiungi button { flex: 0 0 auto; }
#tappe_intro { font-size: 16px; color: var(--ink); }
.info { font-size: 16px; color: var(--ink); background: #fff8ec; border-left: 4px solid var(--sec); padding: 8px 10px; border-radius: 6px; }
ol#tappe { margin: 12px 0 0; padding-left: 26px; font-size: 19px; }
ol#tappe li { padding: 10px 0; border-bottom: 1px solid var(--line); }
ol#tappe li > span.grow { display: block; }
ol#tappe .mosse { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
ol#tappe .mosse button { min-height: 44px; padding: 8px 12px; font-size: 16px; }
ol#tappe .dove { display: block; font-size: 17px; color: var(--ink); }
ol#tappe .dove.pg { font-weight: 600; color: var(--acc); }
article.tratto { border: 1px solid var(--line); border-left: 6px solid var(--acc); border-radius: 12px; padding: 10px 14px; margin: 10px 0; background: #fbfcfd; }
article.tratto b { font-size: 19px; }
article.tratto .mi { font-size: 24px; font-weight: 700; color: var(--acc); white-space: nowrap; }
article.tratto p { margin: 4px 0; }
article.tratto .pp { font-size: 17px; color: var(--ink); }
.nota { font-size: 16px; margin: 6px 0 12px; color: var(--ink); }
.limite { font-size: 17px; font-weight: 600; color: var(--ink); border-left: 4px solid var(--acc); padding: 6px 10px; background: #f4f7fa; border-radius: 6px; }
.totale { font-size: 21px; font-weight: 700; margin: 12px 0; }
.azioni { margin-top: 10px; }
.foglio { display: none; }
@media print {
  body.stampa-una main .card { display: none !important; }
  body.stampa-una .foglio { display: block !important; font-size: 20px; line-height: 1.35; }
  body.stampa-una .foglio h1 { font-size: 32px; margin: 0 0 4px; color: #173B52; }
  body.stampa-una .foglio h2 { font-size: 23px; margin: 16px 0 6px; }
  body.stampa-una .foglio ol li { margin: 6px 0; }
  body.stampa-una .foglio table.t { font-size: 20px; width: 100%; border-collapse: collapse; }
  body.stampa-una .foglio td, body.stampa-una .foglio th { padding: 9px 8px; border-bottom: 1px solid #999; text-align: left; vertical-align: top; }
  body.stampa-una .foglio td.n { font-weight: 700; white-space: nowrap; }
  body.stampa-una .foglio .tot { font-size: 22px; }
  .foglio-testa { font-size: 14px; color: #444; }
  .fonte { font-size: 15px; color: #222; }
}

</style></head>
<body>
<header class="app"><div class="in"><div class="et"></div><h1></h1><div class="sub"></div></div></header>
<main><div class="in">
<section class="card" id="tappe_card">
  <h2>Your stops</h2>
  <p class="muted" id="tappe_intro"></p>
  <label class="lab" for="cerca">Add a stop</label>
  <div class="row aggiungi">
    <input id="cerca" type="text" list="sedi" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="Type a town or a county">
    <button id="aggiungi">Add</button>
  </div>
  <datalist id="sedi"></datalist>
  <p id="cerca_err" class="ko nascosto" role="alert"></p>
  <p id="cerca_info" class="info nascosto" aria-live="polite"></p>
  <ol id="tappe"></ol>
  <p class="muted" id="tappe_vuoto">No stops yet. Add at least two.</p>
  <div class="row azioni">
    <button id="casa" class="sec nascosto">Add the drive back to the start</button>
  </div>
</section>

<section class="card" id="tratti_card">
  <h2>Your legs</h2>
  <p class="muted" id="tratti_vuoto">The legs show up here once you have two stops.</p>
  <div id="tratti"></div>
  <p id="totale" class="totale nascosto"></p>
  <p class="nota limite nascosto" id="nota_limite"></p>
  <p class="nota nascosto" id="nota_miglia"></p>
  <p class="nota nascosto" id="nota_gas"></p>
  <div class="row azioni">
    <button id="stampa">Print the route card</button>
    <button id="svuota" class="ghost">Clear the route</button>
  </div>
</section>

<section id="foglio" class="foglio" aria-hidden="true"></section>

</div></main>
<footer class="app"><div class="in"></div></footer>

function impronta(s) {
  s = (CONFIG.id || "") + "|" + String(s).trim().toUpperCase().replace(/\s+/g, "");
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16);
}
function finestra(titolo, testo, bottoni) {
  return new Promise((ok) => {
    const m = document.createElement("div");
    m.className = "modale";
    m.innerHTML = `<div class="card" role="dialog" aria-modal="true"><h2>${esc(titolo)}</h2><p>${esc(testo)}</p><div class="row"></div></div>`;
    const r = $(".row", m);
    bottoni.forEach(([etichetta, valore, classe]) => {
      const b = document.createElement("button");
      b.textContent = etichetta; if (classe) b.className = classe;
      b.onclick = () => { m.remove(); ok(valore); };
      r.appendChild(b);
    });
    document.body.appendChild(m);
    $("button", m).focus();
  });
}
function intestazione() {
  document.documentElement.lang = CONFIG.lingua || "en";
  document.title = CONFIG.titolo;
  if (CONFIG.colori) {
    if (CONFIG.colori.accento) document.documentElement.style.setProperty("--acc", CONFIG.colori.accento);
    if (CONFIG.colori.secondo) document.documentElement.style.setProperty("--sec", CONFIG.colori.secondo);
  }
  $("header.app .et").textContent = T("etichetta", "Extra content");
  $("header.app h1").textContent = CONFIG.titolo;
  $("header.app .sub").innerHTML = esc(T("per_lettori", "For readers of")) + " <i>" + esc(CONFIG.libro) + "</i>" + (CONFIG.autore ? " · " + esc(CONFIG.autore) : "");
  const f = $("footer.app .in");
  f.innerHTML = "";
  [CONFIG.avvertenza, CONFIG.non_affiliato, T("memoria", "Your progress is saved only in this browser, on this device.")]
    .filter(Boolean).forEach((t) => { const p = document.createElement("p"); p.textContent = t; f.appendChild(p); });
}
function porta(avvia) {
  intestazione();
  if (!CONFIG.codice_impronta || Memoria.leggi("aperta", false) === CONFIG.codice_impronta) { avvia(); return; }
  const p = document.createElement("section");
  p.id = "porta";
  p.innerHTML = `<div class="card"><h2>${esc(T("codice_titolo", "Enter your access code"))}</h2>
    <p class="muted">${esc(T("codice_dove", "You will find the code inside your copy of the book."))}</p>
    <label class="lab" for="codice">${esc(T("codice_etichetta", "Access code"))}</label>
    <input id="codice" type="text" autocomplete="off" autocapitalize="characters">
    <p id="codice_err" class="ko nascosto">${esc(T("codice_errato", "This code doesn't match. Check it in the book and try again."))}</p>
    <div class="row" style="margin-top:12px"><button id="codice_ok">${esc(T("codice_apri", "Open"))}</button></div></div>`;
  $("main .in").prepend(p);
  const prova = () => {
    if (impronta($("#codice").value) === CONFIG.codice_impronta) { Memoria.scrivi("aperta", CONFIG.codice_impronta); p.remove(); avvia(); }
    else { $("#codice_err").classList.remove("nascosto"); }
  };
  $("#codice_ok").onclick = prova;
  $("#codice").addEventListener("keydown", (e) => { if (e.key === "Enter") prova(); });
  $("#codice").focus();
}
function mescola(a, rnd = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Ohio Drive Planner: stops among the 88 county seats and the cities of the city maps, the miles for every leg over the
// ODOT state route network (the same graph as the atlas's distance table), the atlas page and square of every stop,
// a large-type route card to print, and the route kept in this browser.
let TAPPE = [];          // indexes into DATI.tappe
const NF = (n) => Number(n).toLocaleString("en-US");

function norm(s) {
  return String(s || "").toLowerCase().replace(/[’']/g, "'").replace(/\./g, " ").replace(/,/g, " ")
    .replace(/\s+/g, " ").trim()
    .replace(/\s+(oh|ohio)$/, "")                                  // "Wooster, OH", "Cleveland, Ohio"
    .replace(/\bsaint\b/g, "st").replace(/\bmount\b/g, "mt").replace(/\bcourt house\b/g, "ch").replace(/\bc h\b/g, "ch")
    .replace(/^wash\b/, "washington").replace(/\bco$/, "county")   // "Wash CH", "Wayne Co"
    .replace(/\s+/g, " ").trim();
}
function senzaContea(s) { return s.replace(/\s+county$/, "").trim(); }
function distanza(a, b) {          // edit distance, for "Did you mean…?"
  const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const q = [i];
    for (let j = 1; j <= n; j++) q[j] = Math.min(p[j] + 1, q[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = q;
  }
  return p[n];
}
function sedeDi(contea) { return DATI.tappe.findIndex((t) => t.s && t.c === contea); }
function etichetta(i) { const c = DATI.tappe[i]; return c.n + ", " + c.c + " " + T("county", "County"); }
function paginaTappa(i) {
  const c = DATI.tappe[i];
  let t = T("pag", "page") + " " + c.p + ", " + c.q;
  (c.x || []).forEach((e) => {
    t += " · " + (e[2] ? T("dettaglio", "detail map") : T("mappa_citta", "city map")) + ", " + T("pag", "page") + " " + e[0] + ", " + e[1];
  });
  return t;
}
function tratto(a, b) {               // miles and atlas pages between two stops
  if (a === b) return { mi: 0, pagine: [] };
  const i = Math.min(a, b), j = Math.max(a, b);
  const mi = DATI.miglia[i][j - i - 1];
  const pg = DATI.pagine[i][j - i - 1].slice();
  if (a > b) pg.reverse();
  // the stops' own pages (Index of Places) at the two ends, if the route list doesn't have them
  if (!pg.includes(DATI.tappe[a].p)) pg.unshift(DATI.tappe[a].p);
  if (!pg.includes(DATI.tappe[b].p)) pg.push(DATI.tappe[b].p);
  return { mi, pagine: pg };
}
function salva() { Memoria.scrivi("percorso", TAPPE); }
function plurale(n, uno, molti) { return n === 1 ? uno : molti.replace("{n}", NF(n)); }
function listaPagine(p) { return p.length ? p.join(", ") : T("stessa_pagina", "the same page"); }

function compatta() {         // two identical stops in a row (after a removal or a move): keep one
  const prima = TAPPE.length;
  TAPPE = TAPPE.filter((t, k) => k === 0 || t !== TAPPE[k - 1]);
  return prima - TAPPE.length;
}
function cambiato() {         // the list changed by hand: the old note no longer applies
  $("#cerca_info").classList.add("nascosto");
  if (compatta()) { $("#cerca_info").textContent = T("doppia", "Two stops in a row were the same town: one was taken off."); $("#cerca_info").classList.remove("nascosto"); }
  salva();
}
function disegna(fuoco) {
  const ol = $("#tappe");
  ol.innerHTML = TAPPE.map((t, k) => `<li><span class="grow"><b>${esc(DATI.tappe[t].n)}</b>
      <span class="dove">${esc(DATI.tappe[t].c)} ${esc(T("county", "County"))}</span>
      <span class="dove pg">${esc(paginaTappa(t))}</span></span>
      <span class="mosse"><button class="sec su" data-k="${k}" ${k === 0 ? "disabled" : ""} aria-label="${esc(T("su_aria", "Move up"))}">↑ ${esc(T("su", "Up"))}</button>
      <button class="sec giu" data-k="${k}" ${k === TAPPE.length - 1 ? "disabled" : ""} aria-label="${esc(T("giu_aria", "Move down"))}">↓ ${esc(T("giu", "Down"))}</button>
      <button class="ghost togli" data-k="${k}">${esc(T("togli", "Remove"))}</button></span></li>`).join("");
  $("#tappe_vuoto").classList.toggle("nascosto", TAPPE.length > 0);
  $("#casa").classList.toggle("nascosto", !(TAPPE.length >= 2 && TAPPE[0] !== TAPPE[TAPPE.length - 1]));
  const muovi = (k, d) => { [TAPPE[k + d], TAPPE[k]] = [TAPPE[k], TAPPE[k + d]]; cambiato(); disegna({ k: Math.min(k + d, TAPPE.length - 1), cl: d < 0 ? "su" : "giu" }); };
  $$(".su", ol).forEach((b) => b.addEventListener("click", () => muovi(+b.dataset.k, -1)));
  $$(".giu", ol).forEach((b) => b.addEventListener("click", () => muovi(+b.dataset.k, 1)));
  $$(".togli", ol).forEach((b) => b.addEventListener("click", () => { const k = +b.dataset.k; TAPPE.splice(k, 1); cambiato(); disegna({ k: Math.min(k, TAPPE.length - 1), cl: "togli" }); }));
  if (fuoco && fuoco.k >= 0) {      // keep the keyboard on the same row
    const b = $$("." + fuoco.cl, ol)[fuoco.k];
    if (b && !b.disabled) b.focus(); else { const c = $$("button:not([disabled])", ol)[0]; if (c) c.focus(); }
  }
  const box = $("#tratti");
  const due = TAPPE.length >= 2;
  ["#totale", "#nota_limite", "#nota_miglia", "#nota_gas"].forEach((s) => $(s).classList.toggle("nascosto", !due));
  $("#tratti_vuoto").classList.toggle("nascosto", due);
  if (!due) { box.innerHTML = ""; return; }
  let tot = 0;
  box.innerHTML = TAPPE.slice(1).map((t, k) => {
    const a = TAPPE[k], tr = tratto(a, t); tot += tr.mi;
    return `<article class="tratto" data-k="${k}">
      <div class="row"><b class="grow">${esc(DATI.tappe[a].n)} → ${esc(DATI.tappe[t].n)}</b><span class="mi">${NF(tr.mi)} ${esc(T("miglia", "mi"))}</span></div>
      <p class="pp">${esc(T("pagine_tratto", "Atlas pages along the way"))}: ${esc(listaPagine(tr.pagine))}</p>
    </article>`;
  }).join("");
  const nl = TAPPE.length - 1;
  $("#totale").textContent = T("totale", "Total: about {n} miles in {k}.").replace("{n}", NF(tot)).replace("{k}", plurale(nl, T("una_tappa", "1 leg"), T("piu_tappe", "{n} legs")));
}
function trova(v) {      // { i, altra } or { errore }
  const q = norm(v);
  if (!q) return {};
  const tutti = DATI.tappe.map((c, k) => k);
  let i = tutti.find((k) => norm(etichetta(k)) === q);
  if (i !== undefined) return { i, altra: -1 };
  const qq = senzaContea(q), detta = qq !== q;
  // a town name wins over a county name: "Lorain" is the city of Lorain, not Elyria, the seat of Lorain County
  const citta = detta ? [] : tutti.filter((k) => norm(DATI.tappe[k].n) === qq);
  const sedi = tutti.filter((k) => DATI.tappe[k].s && norm(DATI.tappe[k].c) === qq);
  if (citta.length === 1) {
    const al = sedi.find((k) => k !== citta[0]);
    return { i: citta[0], altra: al === undefined ? -1 : al };
  }
  if (citta.length > 1) return { errore: T("piu_citta", "More than one stop has that name. Pick one from the list as you type: it shows the county.") };
  if (sedi.length === 1) return { i: sedi[0], altra: -1, contea: true };
  // a town of the Index of Places that isn't a stop: say where it is and which county seat to use
  const luoghi = (DATI.luoghi || []).filter((l) => norm(l[0]) === qq);
  if (luoghi.length) {
    const righe = luoghi.slice(0, 4).map((l) => {
      const sd = sedeDi(l[1]);
      return T("non_tappa", "{luogo} ({contea} County, page {p}, {q}) isn’t a stop; its county seat, {sede}, is.")
        .replace("{luogo}", l[0]).replace("{contea}", l[1]).replace("{p}", l[2]).replace("{q}", l[3]).replace("{sede}", sd >= 0 ? DATI.tappe[sd].n : "");
    });
    return { errore: righe.join(" ") + " " + T("solo_sedi", "The planner measures between county seats and the cities of the city maps.") };
  }
  // one or two letters off: suggest the name
  let best = null, bd = 3;
  tutti.forEach((k) => {
    const nomi = [DATI.tappe[k].n];
    if (DATI.tappe[k].s) nomi.push(DATI.tappe[k].c + " " + T("county", "County"));
    nomi.forEach((nm) => {
      const d = distanza(norm(nm), q);
      if (d < bd && q.length >= 4) { bd = d; best = nm; }
    });
  });
  if (best) return { errore: T("forse", "No stop by that name. Did you mean {nome}?").replace("{nome}", best) };
  return { errore: T("non_trovato", "No stop by that name. Pick one from the list as you type, by town or by county.") };
}
function aggiungi() {
  const err = $("#cerca_err"), info = $("#cerca_info");
  const r = trova($("#cerca").value);
  if (r.i === undefined && !r.errore) return;
  info.classList.add("nascosto");
  if (r.errore) { err.textContent = r.errore; err.classList.remove("nascosto"); return; }
  err.classList.add("nascosto");
  if (TAPPE.length && TAPPE[TAPPE.length - 1] === r.i) { err.textContent = T("stessa", "That’s already your last stop."); err.classList.remove("nascosto"); return; }
  TAPPE.push(r.i); $("#cerca").value = ""; salva(); disegna();
  info.classList.add("nascosto");
  if (r.altra >= 0) {
    const a = DATI.tappe[r.altra];
    info.textContent = T("anche_contea", "Added {citta}, {contea_citta} County. For the county seat of {contea} County, type {sede}.")
      .replace("{citta}", DATI.tappe[r.i].n).replace("{contea_citta}", DATI.tappe[r.i].c).replace("{contea}", a.c).split("{sede}").join(a.n);
    info.classList.remove("nascosto");
  } else if (r.contea) {
    info.textContent = T("sede_aggiunta", "Added {sede}, the county seat of {contea} County.").replace("{sede}", DATI.tappe[r.i].n).replace("{contea}", DATI.tappe[r.i].c);
    info.classList.remove("nascosto");
  }
}
function stampa() {
  if (TAPPE.length < 2) { finestra(T("niente_titolo", "Nothing to print yet"), T("niente_testo", "Add at least two stops first."), [[T("ok", "OK"), true]]); return; }
  const f = $("#foglio");
  const tappe = TAPPE.map((t) => `<li><b>${esc(DATI.tappe[t].n)}</b>, ${esc(DATI.tappe[t].c)} ${esc(T("county", "County"))}: ${esc(paginaTappa(t))}</li>`).join("");
  const righe = TAPPE.slice(1).map((t, k) => {
    const a = TAPPE[k], tr = tratto(a, t);
    return `<tr><td>${esc(DATI.tappe[a].n)} → ${esc(DATI.tappe[t].n)}</td><td class="n">${NF(tr.mi)}</td><td>${esc(listaPagine(tr.pagine))}</td></tr>`;
  }).join("");
  f.innerHTML = `<h1>${esc(T("scheda", "Route card"))}</h1>
    <p class="foglio-testa">${esc(CONFIG.titolo)} · <i>${esc(CONFIG.libro)}</i></p>
    <h2>${esc(T("le_tappe", "Stops, with their atlas page and square"))}</h2><ol>${tappe}</ol>
    <h2>${esc(T("i_tratti", "Legs"))}</h2>
    <table class="t"><thead><tr><th>${esc(T("tratto", "Leg"))}</th><th>${esc(T("miglia", "mi"))}</th><th>${esc(T("pagine", "Atlas pages along the way"))}</th></tr></thead><tbody>${righe}</tbody></table>
    <p class="tot"><b>${esc($("#totale").textContent)}</b></p>
    <p class="fonte">${esc($("#nota_miglia").textContent)} ${esc($("#nota_gas").textContent)} ${esc(T("dati_gas", ""))}</p>
    <p class="fonte">${esc(CONFIG.avvertenza)}</p>`;
  document.body.classList.add("stampa-una");
  window.print();
}

function avvia() {
  TAPPE = (Memoria.leggi("percorso", []) || []).filter((x) => Number.isInteger(x) && x >= 0 && x < DATI.tappe.length);
  const ord = DATI.tappe.map((c, i) => i).sort((a, b) => DATI.tappe[a].n.localeCompare(DATI.tappe[b].n));
  $("#sedi").innerHTML = ord.map((i) => `<option value="${esc(etichetta(i))}"></option>`).join("");
  $("#tappe_intro").textContent = T("intro", "Add the towns you’ll pass through, in order. Type the town or the county.");
  $("#nota_miglia").textContent = T("nota_miglia", "");
  $("#nota_limite").textContent = T("limite", "");
  $("#nota_gas").textContent = T("nota_gas", "");
  $("#aggiungi").addEventListener("click", aggiungi);
  $("#cerca").addEventListener("keydown", (e) => { if (e.key === "Enter") aggiungi(); });
  $("#cerca").addEventListener("input", () => { $("#cerca_err").classList.add("nascosto"); });
  $("#casa").addEventListener("click", () => { if (TAPPE.length >= 2 && TAPPE[0] !== TAPPE[TAPPE.length - 1]) { TAPPE.push(TAPPE[0]); salva(); disegna(); } });
  $("#stampa").addEventListener("click", stampa);
  $("#svuota").addEventListener("click", async () => {
    if (!TAPPE.length) return;
    const ok = await finestra(T("svuota_titolo", "Clear the route?"), T("svuota_testo", "All the stops come off."), [[T("svuota_si", "Clear it"), true], [T("annulla", "Cancel"), false, "sec"]]);
    if (ok) { TAPPE = []; salva(); disegna(); $("#cerca_info").classList.add("nascosto"); $("#cerca_err").classList.add("nascosto"); }
  });
  window.addEventListener("afterprint", () => document.body.classList.remove("stampa-una"));
  disegna();
}

porta(avvia);
</script>
</body></html>
